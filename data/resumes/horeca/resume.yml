title:
  when_target_bar: |
    Barman

subtitles:
  - Disponible la saison d'hiver 2026-2027

languages:
  fr: |
    **Français** langue maternelle, **anglais** bilingue C1+, allemand élémentaire A2.
  en: |
    French native, English fluent C1+, German basic A2.

about:
  when_target_bar:
    fr: | # markdown
      Autant que la qualité du service, ce que j'aime dans
      le métier de barman, c'est le contact humain. À l’aise avec
      une clientèle locale comme internationale, je recherche un
      poste où la qualité du service, l’ambiance et l'échange
      font partie intégrante de l’expérience.

competences:
  - title:
      fr: |
        Hospitalité
    description:
      when_target_bar:
        fr: | # markdown
          - Service chaleureux et attention portée à la satisfaction client
          - Maintient de la qualité et de l'efficacité du service, y compris sous pression
          - Sourire jusqu'au départ du dernier client (voire après) ☺

  - title:
      fr: |
        Compétences bar
    description:
      when_target_bar:
        fr: | # markdown
          - Préparation de cocktails classiques et signature
          - Tirage de bière, boissons variées
          - Système de caisse (Scanpiii) et encaissement
          - Mise en place, réassort et fermeture

  - title:
      fr: |
        Esprit d'équipe
    description:
      when_target_bar:
        fr: | # markdown
          - Coordination entre bar et cuisine pour assurer la fluidité du service en période d'affluence
          - Soutien des collègues
          - Contribution à l'ambiance positive et accueillante

  - title:
      fr: |
        Gestion du rush
    description:
      when_target_bar:
        fr: | # markdown
          - Prioritisation des tâches **importantes** et **urgentes**
          -	Capacité d'adaptation en fonction des priorités et imprévus
          - Maintien de la qualité du service pendant les pics d'activité

  - title:
      fr: |
        Fiabilité
    description:
      when_target_bar:
        fr: | # markdown
          - Ponctuel
          - Disponible pour toute la saison
          - Service de nuit et lors d'événements prolongés
          - De la région
          - Motorisé, permis B
          -	Intégration rapide dans de nouvelles équipes

experiences:
  - company: Service et événementiel
    description:
      fr: | # markdown
        Entre travail et bénévolat, dans divers événements de quelques dizaines à plusieurs milliers de personnes,
        j'ai développé des compétences dans l'accueil, le service et l'organisation.

    subsections:
      - from: 2026
        title: Barman au Meraki
        description:
          fr: | # markdown
            - Bar terrasse au centre de Lausanne, engagé pour la **Coupe du Monde**
            - Clientèle locale et internationale
            - Préparation de cocktails et boissons variées
            - Encaissement
            - Mise en place et fermeture
            - Service en période de forte affluence
            - Collaboration avec une équipe de 4 à 8 personnes
            - *Plusieurs retours positifs de mes collègues, responsables et de la clientèle ont confirmé que mon naturel pour le contact client se traduit par un service chaleureux, y compris lors des rushs les plus soutenus*

      - from: 2020
        to: now
        title: Service en événements
        description:
          fr: | # markdown
            - Mise en place de lieux d'événements
            - Tirage de bière, préparation de cocktails et petite restauration
            - Service nocturne lors de manifestations à forte affluence
            - *Lors de festivals, de fêtes de village et de repas de soutien, je mets à profit mon enthousiasme et ma motivation pour faire vivre des associations locales*

      - from: 2021
        to: now
        title: Protection Civile
        description:
          fr: | # markdown
            - Gestion des flux de personnes et orientation du public lors d'événements à forte affluence
            - Travail d'équipe
            - Organisation et installation de lieux de manifestations
            - Formation continue aux premiers secours

  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme d'**e-commerce**
        lausannoise vendant des objets de design et publiant des articles sur l'actualité culturelle.

    subsections:
      - from: 2022
        to: 2025
        title: Lead Developer
        description:
          fr: | # markdown
            - Développement et design web
            - Recrutement et gestion d'équipe
            - Coordination entre les équipes produit, communication et administratives
            - *Reconnu pour mon autonomie et ma prise d'initiative, je me suis fais confier la responsabilité de la refonte complète du site web. J'ai notamment recruté et encadré une équipe de cinq développeurs anglophones jusqu'à la mise en production de la nouvelle plateforme*

diplomas:
  - from: 2018
    to: 2022
    title: | # markdown
      CFC de graphisme
    description:
      fr: | # markdown
        Diplômé de l'**ēracom**, j'ai été récompensé par le prix de l’école
        et la distinction de la SGD (Swiss Graphic Designers) reconnaissant
        la qualité de mon travail et les meilleurs résultats tout au long de ma formation.

  - from: 2018
    to: 2022
    title: | # markdown
      Maturité professionnelle
      en arts appliqués
    description:
      fr: | # markdown
        Obtention d'une **maturité professionnelle** en parallèle de mon CFC, avec spécialisation
        en arts appliqués, culture, information et communication.

interests:
  title:
    fr: Engagements & intérêts

  text:
    fr: | # markdown
      Bénévole actif, je participe régulièrement à des événements locaux et culturels.
      Passionné par le design et la technologie, je maintiens une veille active et entretiens ma curiosité.
      Le temps qu'il me reste, je le passe suspendu à un parapente.

footnote:
  title:
    fr: | # markdown
      Besoin de plus d'informations ?

  text:
    fr: | # markdown
      Disponible pour des informations supplémentaires et pour un essai !
