title:
  when_target_bar: |
    Employé de bar
    support opérationnel
  when_target_guinguette: |
    Employé polyvalent
    service et restauration

subtitles:
  - Disponible immédiatement
  - soirs, week-end
  - horaires flexibles

languages:
  fr: |
    Français langue maternelle, anglais avancé C1+, allemand élémentaire A2.
  en: |
    French native, English fluent C1+, German basic A2.

about:
  when_target_bar:
    fr: | # markdown
      Souriant et fiable, avec expérience en service lors d’événements et habitué aux environnements exigeants,
      je suis à l’aise sous pression et en équipe. Disponible immédiatement, je cherche
      un poste en support bar (barback, runner ou service), en extra ou fixe.
  when_target_guinguette:
    fr: | # markdown
      Souriant et fiable, avec expérience en service, j’apprécie les environnements vivants
      mêlant culture, restauration et musique. À l’aise en équipe et polyvalent, je suis motivé aussi bien en service,
      au bar, en cuisine ou sur l’événementiel. Disponible pour la saison, en fixe ou en extra.

competences:
  - title:
      fr: Esprit d'équipe
    description:
      when_target_bar:
        fr: | # markdown
          - Coordination avec les collègues pour assurer un service fluide
          - Communication efficace pour éviter les blocages
          - Travail en équipe lors de rushs et d’événements à forte affluence
          - Adaptation au rythme collectif et soutien des autres membres
      when_target_guinguette:
        fr: | # markdown
          - Communication!
          - Coordination et soutien mutuel pendant les rushs
          - Collaboration entre les équipes de service, cuisine et événementiel

  - title:
      fr: Adaptabilité
    description:
      when_target_bar:
        fr: | # markdown
          -	Prise en main rapide de nouveaux environnements
          -	Apprentissage autonome de nouvelles méthodes selon les besoins
          -	Capacité d'adaptation en fonction des priorités
          -	Intégration rapide dans de nouvelles équipes et contextes
      when_target_guinguette:
        fr: | # markdown
          - Intégration rapide dans de nouveaux environnements
          - Compréhension et prise en main autonome de nouvelles méthodes
          - Flexibilité selon les priorités

  - title:
      fr: Gestion du rush
    description:
      when_target_bar:
        fr: | # markdown
          -	Habitué aux environnements exigeants avec délais serrés
          - Gestion des priorités en situation d’urgence et maintien de la qualité
          -	Capacité à rester efficace et concentré en rush
      when_target_guinguette:
        fr: | # markdown
          - Prioritisation entre les tâches *urgentes* et *importantes*
          - Maintient de la qualité du service
          - Big smile jusqu'au départ du dernier client (voire après) ☺

  - title:
      fr: Fiabilité et rigueur
    description:
      when_target_bar:
        fr: | # markdown
          - Attention portée aux détails et à la qualité du travail
          - Exécution précise des tâches même en environnement dynamique
          - Endurance lors d'événements prolongés
          - Engagement à long terme
      when_target_guinguette:
        fr: | # markdown
          - Ponctualité, attention aux détails
          - Endurance lors d'événements prolongés
          - Engagement sur la durée
          - De la région

experiences:
  - company: Associations et événements
    description:
      fr: | # markdown
        Membre d'associations locales, je participe à de nombreux événements culturels et festifs depuis des années,
        de 100 à plusieurs milliers de personnes, développant des compétences en organisation, logistique et accueil.

    subsections:
      - from: 2020
        to: now
        title: Service et restauration
        description:
          fr: | # markdown
            - Bar et restauration lors d’événements
            - Tirage de bière, préparation de cocktails simples
            - Encaissement
            - Mise en place, réapprovisionnement et rangement
            - Service nocturne lors de manifestations à forte affluence
            - Manifestations locales, repas de soutien, festivals, événements culturels

      - from: 2021
        to: now
        title: Protection Civile
        description:
          fr: | # markdown
            - Gestion des flux de personnes
            - Orientation du public en forte affluence
            - Travail d'équipe
            - Organisation de lieux d'événements
            - Formation continue aux premiers secours

  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme d'**e-commerce**
        lausannoise d'objets de design et de journalisme culturel.

    subsections:
      - from: 2022
        to: 2025
        title: Lead Developer
        description:
          fr: | # markdown
            - Développeur web responsable du site e-commerce
            - Recrutement et coordination de l'équipe de développeurs
            - Suivi de la qualité du travail et du respect des délais
            - Environnement exigeant avec délais courts

  - company: Freelance
    description:
      fr: | # markdown
        Collaboration avec clients variés, gestion autonome de projets et relation directe.
        - [Chocolate Festival](https://chocolate-festival.ch/presentation/#historique)
        - graphisme [Themrok](https://apademide.ch/fr/kama), DJ lausannois
        - développement [project bachelor écal](https://ecal.ch/fr/feed/projects/8420/modulat/)
        - web et branding [lambert-forte.ch](https://lambert-forte.ch)

    subsections:
      - from: 2019
        to: now
        title: Design et développement
        description:
          fr: | # markdown
            - Gestion directe de la relation client
            - Organisation autonome du travail et respect des délais
            - Compréhension des besoins
            - Capacité à proposer des solutions adaptées et concrètes

  - company: Diplômes
    subsections:
      - from: 2018
        to: 2022
        title: | # markdown
          CFC de graphisme
        description:
          fr: | # markdown
            Diplômé de l'**ēracom**, j'ai été récompensé par le prix de l’école
            et la distinction de la SGD (Swiss Graphic Designers) reconnaissant
            la qualité de mon travail et les meilleurs résultats tout au long de ma formation.

      - from: 2018
        to: 2022
        title: | # markdown
          Maturité professionnelle
          en arts appliqués
        description:
          fr: | # markdown
            En parallèle de mon CFC, obtention d'une **maturité professionnelle** avec spécialisation
            en arts appliqués, culture, information et communication.

footnote:
