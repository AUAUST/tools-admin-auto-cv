title: |
  Employé de bar
  polyvalent et souriant

subtitles:
  - Disponible immédiatement
  - soirs, week-end
  - horaires flexibles

languages:
  fr: |
    Français langue maternelle, anglais avancé C1+, allemand élémentaire A2.
  en: |
    French native, English fluent C1+, German basic A2.

about:
  fr: | # markdown
    Expérimenté au service lors d’événements, avec une expérience
    professionnelle dans un environnement exigeant, je suis à l'aise
    sous pression et dans le travail d'équipe.
    Je cherche à rejoindre un bar en support opérationnel, barback, runner,
    motivé pour un poste fixe ou en extra.

competences:
  - title:
      fr: Travail sous pression
    description:
      fr: | # markdown
        -	Habitué aux environnements exigeants avec délais serrés
        - Gestion des priorités en situation d’urgence et maintien de la qualité
        -	Capacité à rester efficace et concentré en période de forte charge

  - title:
      fr: Esprit d'équipe
    description:
      fr: | # markdown
        - Coordination avec l'équipe pour atteindre le but commun
        - Communication claire pour fluidifier et éviter les blocages
        -	Travail en équipe lors d’événements à forte affluence
        -	Adaptation au rythme collectif et soutien des autres membres

  - title:
      fr: Adaptabilité et apprentissage rapide
    description:
      fr: | # markdown
        -	Prise en main rapide de nouveaux environnements
        -	Apprentissage autonome de nouvelles méthodes selon les besoins
        -	Capacité d'adaptation en fonction des priorités
        -	Intégration rapide dans de nouvelles équipes et contextes

  - title:
      fr: Fiabilité et rigueur
    description:
      fr: | # markdown
        - Attention portée aux détails et à la qualité du travail rendu
        - Exécution précise des tâches même en environnement dynamique
        - Engagement dans la durée

experiences:
  - company: Associations et événements
    description:
      fr: | # markdown
        Membre d'associations locales, j'ai participé à divers événements culturels et festifs,
        développant des compétences en organisation, logistique et accueil.

    subsections:
      - from: 2020
        to: now
        title: Service bénévole
        description:
          fr: | # markdown
            - Service boissons et petite restauration lors d’événements
            - Gestion de la caisse
            - Mise en place, réapprovisionnement et rangement
            - Service nocturne lors de manifestations à forte affluence
            - manifestations locales, repas de soutien, désalpes, fêtes 1er août, cantonale de Givrins

      - from: 2021
        to: now
        title: Protection Civile
        description:
          fr: | # markdown
            - Travail d'équipe
            - Organisation de lieux d'événements
            - Gestion des flux de personnes et maintien de la sécurité
            - Formation continue aux premiers secours et gestion de situations d’urgence

  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme d'**e-commerce** suisse
        d'objets de design et de journalisme culturel.

    subsections:
      - from: 2022
        to: 2025
        title: Lead Developer
        description:
          fr: | # markdown
            - Développeur web responsable du site e-commerce
            - Recrutement et coordination de l'équipe de développeurs
            - Suivi de la qualité du travail et du respect des délais
            - Environnement exigeant avec délais courts
            - Assurance de la sécurité technique
            - Résolution rapide de problèmes en situation critique

  - company: Freelance
    description:
      fr: | # markdown
        - Identité visuelle du [Chocolate Festival](https://chocolate-festival.ch/presentation/#historique)
        - graphisme avec [Themrok](https://apademide.ch/fr/kama), DJ lausannois
        - développement [project bachelor écal](https://ecal.ch/fr/feed/projects/8420/modulat/)
        - web et branding avec [lambert-forte.ch](https://lambert-forte.ch)

    subsections:
      - from: 2019
        to: now
        title: Design et développement
        description:
          fr: | # markdown
            - Collaboration avec clients variés sur des projets créatifs
            - Gestion directe de la relation client
            - Organisation autonome du travail et respect des délais
            - Compréhension des besoins et capacité à proposer des solutions adaptées et concrètes

  - company: Dipômes
    subsections:
      - from: 2018
        to: 2022
        title: | # markdown
          CFC de graphisme
        description:
          fr: | # markdown
            Diplômé de l'**ēracom**, j'ai été récompensé par le prix de l’école
            et la distinction de la SGD (Swiss Graphic Designers) reconnaissant
            la qualité de mon travail et les meilleurs résultats tout au long de ma formation.

      - from: 2018
        to: 2022
        title: | # markdown
          Maturité professionnelle
          en arts appliqués
        description:
          fr: | # markdown
            En parallèle de mon CFC, obtention d'une **maturité professionnelle** avec spécialisation
            en arts appliqués, culture, information et communication.

