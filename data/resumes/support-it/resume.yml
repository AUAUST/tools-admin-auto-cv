title:
  fr: |
    Support informatique & accompagnement des utilisateurs

subtitles:
  - fr: |
      Rigueur technique et goût du contact humain

about:
  fr: | # markdown
    Graphiste de formation, je suis passé au développement web et suis devenu, un an après mon arrivée,
    lead developer d'une petite entreprise lausannoise et sa personne de référence pour l'informatique du quotidien.
    Derrière un bar, sans expérience préalable du service, j'ai découvert le plaisir du contact direct avec les gens.
    J'en retiens que j'apprends vite, et ce que je veux : un rôle en informatique, au contact des utilisateurs.

languages:
  fr: | # markdown
    **Français** langue maternelle, **anglais** bilingue C1+, **allemand** élémentaire A2.

competences:
  - title: Relation utilisateurs
    description: | # markdown
      **Vulgarisation technique**, écoute, gestion de demandes simultanées et des **interruptions**, y compris sous pression.
      **Formation** et **accompagnement** d'utilisateurs non techniques.

  - title: Diagnostic & culture informatique
    description: | # markdown
      Approche **méthodique** des incidents : reproduire, isoler la cause, corriger, documenter.
      À l'aise sur différents systèmes d'exploitation, en ligne de commande et avec l'infrastructure serveur (**Linux**).
      Sensible aux enjeux de **sécurité** et de **confidentialité des données**.
      Automatisation de tâches en Python, développement PHP et TypeScript.

  - title: Organisation & coordination
    description: | # markdown
      Priorisation des demandes, suivi des **budgets** et des **délais**, coordination de prestataires.
      Traduction des **besoins** des équipes en solutions concrètes.

experiences:
  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme **e-commerce** lausannoise, puis soutien technique en freelance jusqu'en 2026.

    subsections:
      - from: 2023
        to: 2025
        title: Lead Developer
        description:
          fr: | # markdown
            **Gestion d'incidents** en production : pannes serveur, **nettoyage d'un serveur compromis** par une faille de sécurité,
            rédaction d'une **procédure d'incident** pour les équipes.
            Seul développeur interne : **refonte complète** de la plateforme (besoins, solutions, budgets, délais),
            coordination de jusqu'à **5 développeurs** freelance.
            Résultats : chargement **10s** → **150ms**, frais de transaction **-20%**.

      - from: 2022
        to: 2023
        title: Fullstack Developer
        description:
          fr: | # markdown
            **Personne de référence** au bureau pour tout problème informatique du quotidien,
            mise en place d'outils pour les équipes produit et administratives et **formation** à leur utilisation.
            Développement web (**Laravel**, **PHP**, **TypeScript**, **Vue.js**)
            et gestion de l'infrastructure (**Ubuntu**, **MariaDB**, **Redis**, **Docker**).

  - company: Meraki
    description:
      fr: | # markdown
        Bar à cocktails et restaurant au centre de Lausanne.

    subsections:
      - from: 2026
        title: Barman
        description:
          fr: | # markdown
            Poste pris sans expérience du service, rapidement autonome.
            Demandes simultanées et **interruptions** constantes : **réactivité** et calme sous pression.
            Écoute des besoins, conseils personnalisés, goût affirmé pour le contact humain.

  - company: Activités parallèles
    subsections:
      - from: 2021
        to: now
        title:
          fr: |
            Freelance

        description:
          fr: | # markdown
            Design et développement de sites web pour des clients variés,
            **accompagnement** de la définition des besoins à la **mise en production**.
            **Maintenance** et **support** au long cours : noms de domaine, configuration e-mail,
            certificats TLS, sauvegardes, facturation.
            - [lambert-forte.ch](https://lambert-forte.ch)
            - [Chocolate Festival](https://chocolate-festival.ch/presentation/#historique)
            - [auaust.ch](https://auaust.ch)
            - Maintenance de librairies **open-source** utilisées en production
            - [github.com/AUAUST](https://github.com/AUAUST)

      - from: 2021
        to: now
        title: Protection Civile
        description:
          fr: | # markdown
            Spécialiste chauffeur (**permis B**), amené à prendre part à l'organisation et à la sécurité de lieux d'événements,
            à travailler en équipe, à assurer l'orientation du public et la gestion des flux de personnes en forte affluence.

  - company: Diplômes et certifications
    subsections:
      - from: 2025
        title: Certifications
        description:
          fr: | # markdown
            1. **Scrum Master** (PSM 1, Scrum.org) → organisation du travail en équipe, priorisation et amélioration continue.
            2. **Python Associate** (PCAP, Python Institute) → bases solides en programmation, utiles pour scripter et automatiser les tâches répétitives.

      - from: 2018
        title: CFC de graphisme
        description:
          fr: | # markdown
            Diplômé de l’**ēracom** avec honneurs, prix de l’école et une distinction **SGD** (Swiss Graphic Designers),
            reconnaissant les meilleurs résultats de ma promotion.

      - from: 2018
        title: Maturité professionnelle
        description:
          fr: | # markdown
            Parallèle au CFC, obtention d'une **maturité professionnelle** avec spécialisation
            en information, communication, culture et arts appliqués.

interests:
  title:
    fr: Engagements & intérêts

  text:
    fr: | # markdown
      Bénévole actif, je m'investis dans des événements culturels.
      Je maintiens une veille technologique et prends part à des rencontres de la communauté tech.
      Le temps qu'il me reste, je le passe suspendu à un parapente.

