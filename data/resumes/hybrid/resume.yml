title:
  fr: |
    Développeur web fullstack
    & designer

subtitles:
  - fr: |
      À l’interface du design et du code

about:
  fr: | # markdown
    Développeur issu du design, je conçois des applications web où expérience utilisateur,
    choix techniques et contraintes business sont pensés ensemble, du besoin à la mise en production.

languages:
  fr: |
    Français langue maternelle, anglais bilingue C1+, allemand élémentaire A2.

competences:
  - title: Programmation
    description: | # markdown
      - Conception et évolution d’applications web, des besoins métier à la mise en **production**
      - Développement en **TypeScript**, **Laravel**, **Python**, **Vue.js**
      - Gestion des données (**SQL**, **NoSQL**, **Redis**) et de l’infrastructure (**Linux**, **Docker**, **CI/CD**)

  - title: Gestion de projet
    description: | # markdown
      - Organisation du développement et des priorités produit jusqu’à la livraison
      - **Recrutement** et encadrement de développeurs freelance
      - **Coordination** quotidienne entre technique, design et enjeux métier

  - title: Vision produit
    description: | # markdown
      - Conception de solutions web en arbitrant entre contraintes techniques, usage et objectifs business
      - **Analyse** des usages et des données pour orienter les évolutions
      - **Prise de décision** produit basée sur l’expérimentation

experiences:
  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme **e-commerce** lausannoise.
        Refonte progressive du produit vers une architecture plus performante et maintenable.

    subsections:
      - from: 2023
        to: 2025
        title: Lead Developer
        description:
          fr: | # markdown
            - Refonte complète de la plateforme jusqu’à sa mise en production
            - **Réduction** du temps de chargement (**15s** → **150ms**) et des **coûts** de paiement (**-20%**)
            - **Recrutement** et encadrement d’une équipe de 7 développeurs freelance
            - Mise en place de pratiques assurant **qualité** et **stabilité** des livraisons (**tests**, **code reviews**, **CI/CD**)

      - from: 2022
        to: 2023
        title: Fullstack Developer
        description:
          fr: | # markdown
            - Développement de la V2 tout en maintenant la V1 en production
            - Travail quotidien mêlant développement, choix techniques et échanges avec les parties prenantes
            - Intégration des services externes et structuration de l’architecture applicative
            - Suivi de la performance et optimisations (**Plausible**, **KeyCDN**)
            - **Laravel**, **Solid.js**, **MariaDB**, **Redis**

      - from: 2022
        title: Frontend Developer
        description:
          fr: | # markdown
            - Maintenance et évolution de la plateforme existante
            - Développement d’interfaces et amélioration des parcours utilisateurs
            - Contribution à la mise en place du design system
            - Coordination technique avec l’équipe en place

  - company: Projets parallèles
    subsections:
      - from: 2021
        to: now
        title:
          fr: |
            Freelance

        description:
          fr: | # markdown
            - Conception et développement de sites et applications pour des **clients variés**
            - Gestion autonome des projets, de la définition du besoin à la mise en ligne
            - [lambert-forte.ch](https://lambert-forte.ch)
            - [Chocolate Festival](https://chocolate-festival.ch/presentation/#historique)
            - [auaust.ch](https://auaust.ch)

      - from: 2022
        to: now
        title:
          fr: |
            Librairies
            open‑source

        description:
          fr: | # markdown
            - Développement et maintenance de librairies **open-source** utilisées en production
            - Outils visant à **simplifier** des problématiques récurrentes et améliorer la **qualité** du code
            - [github.com/AUAUST](https://github.com/AUAUST)

  - company: Diplômes et certifications
    subsections:
      - from: 2026
        title: Python Associate
        description:
          fr: | # markdown
            Certifié **PCAP** par **Python Institute**, confirmant mes **connaissances approfondies** en programmation générale et mes compétences Python.

      - from: 2025
        title: Scrum Master
        description:
          fr: | # markdown
            Certifié **PSM 1** par **Scrum.org** en gestion de projets SCRUM, confirmant ma **capacité à organiser** et à **travailler efficacement** dans une équipe agile.

      - from: 2018
        title: | # markdown
          CFC de graphisme
        description:
          fr: | # markdown
            Diplômé de l’**ēracom** avec honneurs, prix de l’école et une distinction **SGD** (Swiss Graphic Designers),
            reconnaissant les meilleurs résultats de ma promotion.

      - from: 2018
        title: | # markdown
          Maturité professionnelle
        description:
          fr: | # markdown
            Parallèle au CFC, obtention d'une **maturité professionnelle** avec spécialisation
            en information, communication, culture et arts appliqués.

interests:
  title:
    fr: Engagements & intérêts

  text:
    fr: | # markdown
      Bénévole actif, je participe régulièrement à l’organisation d’événements locaux et culturels.
      Passionné par les évolutions technologiques, je maintiens une veille active et prends part à des rencontres de la communauté.
      Le temps qu'il me reste, je le passe suspendu à un parapente.

