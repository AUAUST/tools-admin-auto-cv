title:
  fr: |
    Développeur web fullstack
    & designer

subtitles:
  - fr: |
      Sites modernes et performants

about:
  fr: | # markdown
    Développeur diplômé en design, j'associe ces compétences
    pour créer des produits web modernes dont la stratégie intègre
    autant l'expérience utilisateur que la fiabilité technique et la performance.

languages:
  fr: |
    Français langue maternelle, anglais bilingue C1+, allemand élémentaire A2.

competences:
  - title: Programmation
    description: | # markdown
      - Conception, maintien et évolution d’applications web fiables et performantes, des besoins métier à la mise en production
      - Projets en production utilisant **TypeScript**, **Laravel**, **Python**, **Vue.js**, **SQL** et **No SQL**, **Redis**
      - Infrastructure **Linux**, **Docker**, **CI/CD**

  - title: Gestion de projet
    description: | # markdown
      - Organisation du développement et des priorités produit, de la planification à la livraison
      - Recrutement et encadrement de freelances
      - Alignement des décisions entre enjeux techniques, design et business

  - title: Vision produit
    description: | # markdown
      - Conception de solutions web en arbitrant entre contraintes techniques, expérience utilisateur et objectifs business
      - Analyse des données et des usages pour orienter les choix produit
      - Prise de décision basée sur l'analyse et l'expérimentation

experiences:
  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme **e-commerce** lausannoise.
        Refonte progressive d’un produit existant vers une base plus fiable et performante.

    subsections:
      - from: 2023
        to: 2025
        title: Lead Developer
        description:
          fr: | # markdown
            - Responsable de la refonte de la plateforme et de sa mise en production
            - Amélioration majeure des performances (**15s** → **150ms**) et réduction des coûts mesurée (**-20% sur les paiements**)
            - Recrutement et coordination équipe de 7 freelances
            - Définition des pratiques QA, **code reviews**, **documentation**, **tests**, **CI/CD**

      - from: 2022
        to: 2023
        title: Fullstack Developer
        description:
          fr: | # markdown
            - Développement de la V2 en parallèle de la maintenance de la V1
            - Quotidien mêlant programmation, planification et communication avec les parties prenantes
            - Sélection et intégration des outils externes
            - Suivi de la performance et optimisation (**Plausible**, **KeyCDN**)
            - Formation de l'équipe et support client
            - **Laravel**, **Solid.js**, **MariaDB**, **Redis**

      - from: 2022
        title: Frontend Developer
        description:
          fr: | # markdown
            - Maintenance et optimisation de la plateforme existante
            - Développement d’interfaces, amélioration de l’expérience utilisateur
            - Participation à la mise en place du nouveau design system
            - Coordination avec les développeurs de la V1

  - company: Projets parallèles
    subsections:
      - from: 2021
        to: now
        title:
          fr: |
            Freelance

        description:
          fr: | # markdown
            - Réalisation de projets web et design pour des clients variés, de la conception à la production
            - Gestion des projets et relation client, web apps, graphisme, identité visuelle
            - [lambert-forte.ch](https://lambert-forte.ch)
            - [Chocolate Festival](https://chocolate-festival.ch/presentation/#historique)
            - [auaust.ch](https://auaust.ch)

      - from: 2022
        to: now
        title:
          fr: |
            Librairies
            open‑source

        description:
          fr: | # markdown
            - Développement et maintenance de projets **open-source** utilisés en **production**, accessibles sur [github.com/AUAUST](https://github.com/AUAUST)
            - Des outils pour améliorer la productivité et la qualité du code

  - company: Diplômes et certifications
    subsections:
      - from: 2026
        title: Python Associate
        description:
          fr: | # markdown
            Certifié **PCAP** par **Python Institute**, confirmant mes connaissances approfondies en programmation générale et mes compétences Python.

      - from: 2025
        title: Scrum Master
        description:
          fr: | # markdown
            Certifié **PSM 1** par **Scrum.org** en gestion de projets SCRUM, confirmant ma capacité à organiser et à travailler efficacement dans une équipe agile.

      - from: 2018
        title: | # markdown
          CFC de graphisme
        description:
          fr: | # markdown
            Diplômé de l’**ēracom** avec honneurs, prix de l’école et une distinction **SGD** (Swiss Graphic Designers),
            reconnaissant les meilleurs résultats de ma promotion.

      - from: 2018
        title: | # markdown
          Maturité professionnelle
        description:
          fr: | # markdown
            Parallèle au CFC, obtention d'une **maturité professionnelle** avec spécialisation
            en information, communication, culture et arts appliqués.

interests:
  title:
    fr: Engagements & intérêts

  text:
    fr: | # markdown
      Bénévole actif, je participe régulièrement à l’organisation d’événements locaux et culturels.
      Passionné par les évolutions technologiques, je maintiens une veille active et prends part à des rencontres de la communauté.
      Le temps qu'il me reste, je le passe suspendu à un parapente.

