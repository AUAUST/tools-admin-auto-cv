title: |
  Conducteur de bus

subtitles:
  - 100'000 km sur les routes suisses

languages: |
  **Français** langue maternelle, **anglais** bilingue C1+, allemand élémentaire A2.

about: | # markdown
  Des trajets pendulaires de longue distance à la circulation urbaine,
  du passage de cols en road-trip à la manœuvre de remorques à la Protection Civile,
  le volant fait partie de mon quotidien depuis le jour de mes 18 ans.
  Aujourd'hui, je suis motivé à suivre la formation nécessaire pour
  mettre cet intérêt personnel au service du public comme conducteur de bus aux tl.

competences:
  - title: Conduite
    description: | # markdown
      - **Permis B** depuis 5 ans
      - Plus de **100'000 km** dont 3 ans en pendulaire, 120 km quotidiens
      - Conduite de convoi avec **remorque**, transport de personnes et de marchandises
      - Conduite sur **longues distances** et dans des environnements variés

  - title: Sécurité
    description: | # markdown
      - Formation à la **conduite sécurisée**
      - Formation continue aux **premiers secours** et à la **sécurité routière**
      - Conduite dans des conditions routières et météorologiques variées
      - Sens de l’observation et de l’anticipation
      - Tempérament calme et réfléchi

  - title: Flexibilité
    description: | # markdown
      - **Ponctualité**
      - **Horaires irréguliers**
      - Travail de nuit et le week-end
      - Services prolongés en périodes de forte affluence
      - Gestion des imprévus avec calme
      - Prioritisation des tâches

  - title: Contact client
    description: | # markdown
      - Sens du service et **aisance relationnelle**
      - Gestion diplomatique de situations difficiles ou de personnes insistantes
      - Maintien d’une communication **calme** et **professionnelle** sous pression
      - Renseignement, orientation et écoute des besoins du public

experiences:
  - company: Protection Civile
    description: | # markdown
      Attiré par les missions de conduite, j'ai choisi de devenir chauffeur à la Protection Civile
      où j'ai développé des compétences en conduite sécurisée et en manœuvre de remorques.

    subsections:
      - from: 2025
        to: now
        title: Spécialiste Chauffeur
        description: | # markdown
          - Spécialisation volontaire
          - Conduite de véhicules de catégorie B et convois avec remorques
          - Conduite sécurisée et écologique
          - Adaptation aux conditions de circulation et aux spécificités du véhicule
          - *La formation pour devenir chauffeur comporte des cours pratiques sur la conduite de minibus sur des chaussées glissantes, la manœuvre de convois d'une à deux remorques, la gestion des situations d'urgence, la sécurité routière ainsi que la maintenance des véhicules*

      - from: 2021
        to: 2025
        title: Aide à la conduite
        description: | # markdown
          - Formation à la régulation du trafic
          - Formation continue aux premiers secours
          - Gestion des flux de personnes
          - Orientation du public lors d'événements à forte affluence
          - Service en uniforme et représentation de l'organisation

  - company: WELTKERN®
    description: | # markdown
      Évolution pendant trois ans au sein de [weltkern.com](https://weltkern.com), e-commerce lausannois,
      jusqu’à un poste à **responsabilités** impliquant **autonomie**, coordination et gestion d’équipe.

    subsections:
      - from: 2022
        to: 2025
        title: Lead Developer
        description:
          fr: | # markdown
            - Gestion de projets, de leur conception à leur livraison
            - Recrutement et gestion d’équipe
            - Respect des engagements
            - *Chargé de la refonte complète du site web de l’entreprise, j’ai recruté et encadré une équipe de cinq développeurs, coordonné les différents intervenants et assuré la responsabilité du projet jusqu’à sa livraison*

  - company: Meraki
    description: | # markdown
      Désirant mettre l'accent sur le contact humain, j'ai choisi un emploi saisonnier de barman au Meraki, bar terrasse au centre de Lausanne, durant la Coupe du Monde.

    subsections:
      - from: 2026
        title: Barman
        description: | # markdown
          - Travail de nuit et le week-end
          - Contact quotidien avec une clientèle locale et internationale
          - Gestion diplomatique de clients insistants ou en état d’ébriété
          - *Les retours positifs de mes collègues, responsables et de la clientèle ont confirmé mon aisance relationnelle et ma capacité à maintenir un service professionnel, y compris dans les situations les plus soutenues*

diplomas:
  - from: 2018
    to: 2022
    title: CFC de graphisme
    description: | # markdown
      Diplômé de l'**ēracom**, j'ai été récompensé par le prix de l’école
      et la distinction de la SGD (Swiss Graphic Designers) reconnaissant
      la qualité de mon travail et les meilleurs résultats tout au long de ma formation.

  - from: 2018
    to: 2022
    title: Maturité professionnelle
    description: | # markdown
      **Maturité professionnelle** obtenue en parallèle du CFC, avec spécialisation
      en communication, information, culture et arts appliqués.

interests:
  title: Engagements & intérêts
  text: | # markdown
    Bénévole actif, je participe régulièrement à des événements locaux et culturels.
    Passionné de parapente, je pratique un sport exigeant concentration,
    anticipation et analyse des risques pour prendre les bonnes décisions.
    Il sert aussi de prétexte à l’organisation de road-trips et
    à la découverte des paysages suisses et européens par la route.

footnote:
  title: Besoin de plus d'informations ?
  text: | # markdown
    Disponible pour échanger sur ma motivation et mon projet professionnel !
