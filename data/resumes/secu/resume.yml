title: |
  Agent de sécurité

subtitles:
  - Expérience en gestion du public
  - à l'aise sous pression

languages:
  fr: |
    Français langue maternelle, anglais avancé C1+, allemand élémentaire A2.

about:
  fr: | # markdown
    D'un tempérament calme, habitué aux environnements stressants et
    au fort esprit d'équipe, je cherche un poste d'agent de sécurité.
    Disponible immédiatement, pour des horaires flexibles, de nuit et les week-ends.

competences:
  - title:
      fr: Sang-froid et gestion du stress
    description:
      fr: | # markdown
        - Tempérament calme et posé, y compris en situation tendue
        - Observateur attentif
        - Prise de décision claire en situation de stress
        - Communication ferme, respectueuse et concise

  - title:
      fr: Fiabilité et autonomie
    description:
      fr: | # markdown
        - Sens des responsabilités et discrétion
        - Ponctualité stricte et respect des consignes
        - Rigueur dans l'exécution des tâches
        - Grand esprit d'équipe, mais capable de tenir un poste seul
        - Engagement et constance à long terme

  - title:
      fr: Mobilité
    description:
      fr: | # markdown
        - Permis B avec voiture
        - Spécialiste chauffeur à la Protection Civile, formé aux interventions de régulation du trafic
        - À l’aise dans des environnements variés

  - title:
      fr: Profil

    description:
      fr: | # markdown
        - Nationalité suisse, domicilié canton de Vaud
        - Casier judiciaire vierge, solvable
        - Plein exercice des droits civils
        - 23 ans, 178 cm, 75 kg
        - Aucun problème médical

experiences:
  - company: null
    subsections:
      - from: 2021
        to: now
        title: Protection Civile
        description:
          fr: | # markdown
            - Spécialiste chauffeur
            - Formation premiers secours continue
            - Gestion des flux de personnes
            - Surveillance
            - Interventions de régulation du trafic
            - Organisation de lieux d'événements, parking.
            Diverses manifestations dans le canton de Vaud, notamment des
            événements politiques, des festivals (Paléo), des fêtes sportives

      - from: 2017
        to: now
        title: Service
        description:
          fr: | # markdown
            - Service nocturne lors de manifestations à forte affluence
            - Contact avec la clientèle
            - Gestion de la caisse
            - Information et orientation du public.
            Participation à des manifestations d'envergure (Cantonale de Givrins),
            service au Pavillon, bar à Lausanne, et à de nombreux événements de moindre échelle dans la région

  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme d'**e-commerce**
        lausannoise active dans la vente de mobilier et de livres design.

    subsections:
      - from: 2022
        to: 2025
        title: Lead Developer
        description:
          fr: | # markdown
            Responsable du développement, chargé du recrutement et de la coordination d'une équipe de développeurs,
            assurant la qualité du travail et la communication avec les autres départements.
            Environnement exigeant avec délais courts.

  - company: Indépendant
    description:
      fr: | # markdown
        Projets freelance de design et développement web dans lesquels je mets à profit
        mes compétences en relation client et organisation.

    subsections:
      - from: 2019
        to: now
        title: Design et développement
        description:
          fr: | # markdown
            - Communication directe et diplomatique avec le client
            - Compréhension des besoins
            - Respect des contraintes et délais
            - Travail effectué pour [Lambert & Forte fiduciaire SA](https://lambert-forte.ch), [Chocolate Festival](https://chocolate-festival.ch/presentation/#historique) et [projets pour l'écal](https://ecal.ch/fr/feed/projects/8420/modulat/) entre autres

  - company: Diplômes
    subsections:
      - from: 2026
        title: Certification SCRUM
        description:
          fr: | # markdown
            Méthode de travail en équipe permettant une collaboration efficace en environnement dynamique, avec un accent sur la communication.

      - from: 2018
        to: 2022
        title: CFC de graphisme
        description:
          fr: | # markdown
            Diplômé de l’**ēracom** avec prix de l’école et distinction **SGD**, reconnaissant les meilleurs résultats et la constance durant la formation.

      - from: 2018
        to: 2022
        title: Maturité

        description:
          fr: | # markdown
            En parallèle du CFC, obtention d’une **maturité professionnelle** spécialisée
            en information, communication, culture et arts appliqués.

footnote:
