title: |
  Agent de sécurité

subtitles:
  - Horaires flexibles
  - disponible soirs et week-ends

languages:
  fr: |
    Français langue maternelle, anglais avancé C1+, allemand élémentaire A2.

about:
  fr: | # markdown
    De sang froid et habitué à travailler dans des environnements stressants,

competences:
  - title:
      fr: Sang-froid et gestion de conflit
    description:
      fr: | # markdown
        - Tempérament calme et posé
        - Capacité à désamorcer les tensions verbalement
        - Observation rapide des comportements à risque
        - Prise de décision claire en situation de stress
        - Communication ferme, respectueuse et concise

  - title:
      fr: Fiabilité et autonomie
    description:
      fr: | # markdown
        - Ponctualité stricte et respect des consignes
        - Sens des responsabilités et discrétion
        - Capacité à tenir un poste seul sur la durée
        - Rigueur dans l'exécution des tâches
        - Engagement professionnel et constance

  - title:
      fr: Mobilité et sécurité terrain
    description:
      fr: | # markdown
        - Permis B
        - Spécialiste chauffeur à la Protection Civile
        - Formé aux interventions de régulation du trafic
        - Conduite sûre et adaptée aux situations d’urgence
        - Connaissance des règles de sécurité routière et terrain

  - title:
      fr: |
        Aptitude à être
        agent de sécurité
    description:
      fr: | # markdown
        - Nationalité suisse, domicilié canton de Vaud
        - Casier judiciaire vierge, solvable
        - Plein exercice des droits civils
        - Bonne condition physique
        - 23 ans
        - Disponibilité immédiate

experiences:
  - company: Associations et événements
    description:
      fr: | # markdown
        Membre d'associations locales, j'ai participé à divers événements culturels et festifs de 100 à plusieurs milliers de personnes,
        développant des compétences en organisation, logistique et accueil.

    subsections:
      - from: 2020
        to: now
        title: Service bénévole
        description:
          fr: | # markdown
            - Bar et restauration lors d’événements
            - Tirage de bière, préparation de cocktails simples
            - Encaissement
            - Mise en place, réapprovisionnement et rangement
            - Service nocturne lors de manifestations à forte affluence
            - Manifestations locales, repas de soutien, festivals, événements culturels

      - from: 2021
        to: now
        title: Protection Civile
        description:
          fr: | # markdown
            - Gestion des flux de personnes
            - Orientation du public en forte affluence
            - Travail d'équipe
            - Organisation de lieux d'événements
            - Formation continue aux premiers secours

  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme d'**e-commerce**
        lausannoise d'objets de design et de journalisme culturel.

    subsections:
      - from: 2022
        to: 2025
        title: Lead Developer
        description:
          fr: | # markdown
            - Développeur web responsable du site e-commerce
            - Recrutement et coordination de l'équipe de développeurs
            - Suivi de la qualité du travail et du respect des délais
            - Environnement exigeant avec délais courts

  - company: Freelance
    description:
      fr: | # markdown
        Collaboration avec clients variés, gestion autonome de projets et relation directe.
        - [Chocolate Festival](https://chocolate-festival.ch/presentation/#historique)
        - graphisme [Themrok](https://apademide.ch/fr/kama), DJ lausannois
        - développement [project bachelor écal](https://ecal.ch/fr/feed/projects/8420/modulat/)
        - web et branding [lambert-forte.ch](https://lambert-forte.ch)

    subsections:
      - from: 2019
        to: now
        title: Design et développement
        description:
          fr: | # markdown
            - Gestion directe de la relation client
            - Organisation autonome du travail et respect des délais
            - Compréhension des besoins
            - Capacité à proposer des solutions adaptées et concrètes

  - company: Diplômes
    subsections:
      - from: 2018
        to: 2022
        title: | # markdown
          CFC de graphisme
        description:
          fr: | # markdown
            Diplômé de l'**ēracom**, j'ai été récompensé par le prix de l’école
            et la distinction de la SGD (Swiss Graphic Designers) reconnaissant
            la qualité de mon travail et les meilleurs résultats tout au long de ma formation.

      - from: 2018
        to: 2022
        title: | # markdown
          Maturité professionnelle
          en arts appliqués
        description:
          fr: | # markdown
            En parallèle de mon CFC, obtention d'une **maturité professionnelle** avec spécialisation
            en arts appliqués, culture, information et communication.

