about:
  fr: | # markdown
    Expérimenté en développement fullstack,
    diplômé en graphisme et habitué à mener des projets de bout en bout,
    je vois un poste de développeur chez Horde comme une continuité naturelle.
    Mon parcours m'a également permis de développer une aisance relationnelle
    qui facilite le travail en équipe et la collaboration avec les parties prenantes.

languages: | # markdown
  **Français** langue maternelle, **anglais** bilingue C1+, allemand élémentaire A2.

competences:
  - title:
      fr: PHP & e-commerce

    description:
      fr: | # markdown
        - Développement **PHP** moderne
        - Conception et utilisation d'**API REST**, webhooks
        - Développement de plateformes **e-commerce**
        - Intégration de paiements (**Mollie**, **Stripe**)
        - Bases de données **MariaDB**, **MySQL**, **PostgreSQL**, **Redis**

  - title:
      fr: Frontend

    description:
      fr: | # markdown
        - Expertise **TypeScript** et **JavaScript**, **Vue**, **Solid.js**
        - Intégration **HTML**, **CSS**, **Tailwind CSS**
        - SPA et fluidité **Inertia.js**, **Axios**, **Turbo**, **Stimulus**
        - Animations web (**Lottie**, **CSS**), composants interactifs
        - Intégration de maquettes **Figma**
        - **UX**

  - title:
      fr: Qualité web & performance

    description:
      fr: | # markdown
        - Techniques d'optimisation (**CDN**, **caching**, **lazy loading**, **code splitting**)
        - Accessibilité (**ARIA**, bonnes pratiques **WCAG**)
        - CI/CD avec **GitHub Actions**
        - Déploiement sans downtime
        - Tests automatisés
        - **Git**
        - **SEO** technique et monitoring

  - title:
      fr: Collaboration

    description:
      fr: | # markdown
        - Priorisation et gestion de projets simultanés
        - Curiosité technique
        - Communication claire avec profils techniques ou non
        - Autonomie, sens du détail et volonté de qualité
        - Coordination entre développeurs, designers et parties prenantes
        - Recrutement et suivi de petites équipes

experiences:
  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme d'**e-commerce** lausannoise commercialisant
        objets de design et polices de caractères. Stack optimisée **Laravel** et **TypeScript**, **Inertia**.
      en: | # markdown
        Growth within [weltkern.com](https://weltkern.com), a Swiss **e-commerce** platform selling design objects and typefaces.
        Monolithic stack based on **Laravel** and **TypeScript**.

    subsections:
      - from: 2023
        to: 2025
        title: Lead Developer
        description:
          fr: | # markdown
            - Collaboration quotidienne avec designers, marketing et direction produit
            - Refonte complète de la plateforme e-commerce (**Laravel**)
            - Temps de chargement des pages réduit de **15s** à **150ms**
            - Migration **Stripe** → **Mollie** (-20% de frais)
            - **Recrutement** et **encadrement** de 5 développeurs freelance
            - Sprints, code reviews, qualité logicielle

      - from: 2022
        to: 2023
        title: Fullstack Developer
        description:
          fr: | # markdown
            - Développement **Wordpress** puis **Laravel**
            - Gestion de l'infrastructure (**VPS Infomaniak**, **Ploi.io**)
            - CI/CD avec **GitHub Actions**
            - API **Inertia** et **REST**
            - Intégrations d'API et webhooks (**Mollie**, **Stripe**, **Mailchimp**)
            - Performance avec **KeyCDN**, **Redis**
            - **TypeScript**, **Solid.js**, **Vue.js**, **TailwindCSS**, **Figma**

  - company: Projets de développement
    subsections:
      - from: 2022
        to: now
        title:
          fr: |
            Librairies
            open‑source
          en: |
            Open‑source
            Libraries

        description:
          fr: | # markdown
            - Développement et maintenance de projets **open-source**, tous utilisés en **production**
            - [Primitive Kit](https://github.com/AUAUST/lib-js-primitive-kit#readme), utilitaires qui réduisent le boilerplate dans l'usage des primitifs
            - [Jaune](https://github.com/AUAUST/lib-js-jaune#readme), toolkit pour la manipulation des couleurs
            - [G-Class](https://github.com/AUAUST/lib-js-g-class#readme), alternative plus complète à [clsx](https://github.com/lukeed/clsx)

      - from: 2021
        to: now
        title:
          when_design_relevant:
            fr: |
              Dev / Designer
            en: |
              Freelance
              developer
              and designer

          else: Freelance developer

        description:
          fr: | # markdown
            - Développement et design pour des clients variés
            - De la relation client à la maintenance à long terme
            - [lambert-forte.ch](https://lambert-forte.ch)
            - [Hugo Scholl](https://ecal.ch/fr/feed/projects/8420/modulat/)
            - [Chocolate Festival](https://chocolate-festival.ch/presentation/#historique)

  - company: District de Nyon
    subsections:
      - from: 2021
        to: now
        title: Protection Civile
        description: | # markdown
          - Contact direct avec le public
          - Sens des responsabilités
          - Travail d'équipe et coordination avec les autorités
          - Diplomatie et désescalade de situations délicates

diplomas:
  - from: 2026
    title: Scrum Master
    description:
      fr: | # markdown
        Certifié **PSM 1** par **Scrum.org** en gestion de projets SCRUM, confirmant ma capacité à travailler efficacement dans une équipe agile.

  - from: 2025
    title: Python Associate
    description:
      fr: | # markdown
        Certifié **PCAP** par **Python Institute**, confirmant mes compétences en développement Python
        et mes connaissances théoriques en programmation générale.

  - from: 2018
    to: 2022
    title: CFC de graphisme
    description: | # markdown
      Diplômé de l'**ēracom**, j'ai été récompensé par le prix de l’école
      et la distinction de la SGD (Swiss Graphic Designers) reconnaissant
      la qualité de mon travail et les meilleurs résultats tout au long de ma formation.

  - from: 2018
    to: 2022
    title: Maturité professionnelle
    description: | # markdown
      **Maturité professionnelle** obtenue en parallèle du CFC, avec spécialisation
      en communication, information, culture et arts appliqués.

interests:
  title:
    fr: Engagements & intérêts

  text:
    fr: | # markdown
      Bénévole actif, je m'investis dans des événements culturels.
      Je maintiens une veille technologique et prends part à des rencontres de la communauté tech.
      Le temps qu'il me reste, je le passe suspendu à un parapente.

