title:
  when_target_python:
    fr: Développeur web fullstack spécialisé Python
    en: Python-focused fullstack web developer

  when_target_laravel:
    fr: Développeur web fullstack spécialisé Laravel
    en: Laravel-focused fullstack web developer

  when_target_typescript:
    fr: Développeur web fullstack spécialisé TypeScript

  when_design_relevant:
    fr: Développeur web fullstack alliant design et code
    en: Fullstack web developer bridging design and code

  else:
    fr: |
      Développeur fullstack
    en: Fullstack web developer Agile certified

subtitles:
  - when_design_relevant:
      fr: frontends orientés design
      en: Design-driven frontends and

  - when_target_python:
      fr: développement sur stack moderne
      en: development on modern stack

  - when_target_laravel:
      fr: PHP moderne
      en: modern PHP

  - when_target_typescript:
      fr: |
        Performance et fiabilité, APIs, infrastructure et production

  - else: PHP, Laravel

about:
  when_master_mode:
    fr: | # markdown
      Diplômé en design visuel, je conçois des applications où structure du code, clarté et pérennité
      guident l’architecture autant que l’expérience utilisateur.
      Intéressé par les environnements où exigence technique et créativité se rejoignent.
      Mainteneur de plusieurs projets open-source TypeScript utilisés en production.
    en: | # markdown
      Graduated in visual design, I build applications where code structure, clarity,
      and maintainability guide the architecture as much as user experience.
      Interested in environments where technical excellence and creativity meet.
      Maintainer of several TypeScript open-source projects used in production.

  when_target_laravel:
    fr: | # markdown
      Mes années d’expérience en développement full-stack Laravel
      me permettent de concevoir et de faire évoluer des plateformes web
      avec un focus sur la performance et la simplification des workflows complexes.

    en: | # markdown
      Experienced full-stack developer with a background in visual design,
      I’m looking to join a Laravel-focused team to contribute to the creation
      of technically robust and creatively driven products.

  when_target_typescript:
    fr: | # markdown
      Développeur orienté impact produit expérimenté avec TypeScript, Laravel et Python,
      je cherche à rejoindre une équipe agile où mettre à profit mon expertise
      hybride entre développement et compréhension design et marketing.

  when_design_relevant:
    fr: | # markdown
      Développeur web et designer graphique, je cherche aujourd'hui à rejoindre
      une équipe créative où je serai en mesure de mettre à profit mes compétences techniques et
      mon sens esthétique.
    en: | # markdown
      Web developer and graphic designer graduate, I’m looking to join a creative team
      where I can leverage both my technical skills and aesthetic sense.

  else:
    fr: | # markdown
      Développeur full-stack expérimenté, certifié en management Agile, titulaire d'un CFC en design visuel,
      je cherche à rejoindre une équipe de développeurs web où je pourrai contribuer
      à la création de produits à forte valeur technique.
    en: | # markdown
      Experienced full-stack developer with a background in visual design, Agile certified,
      I’m looking to join a web development team where I can contribute
      to the creation of technically robust products.

languages:
  fr: |
    Français langue maternelle, anglais avancé C1+, allemand élémentaire A2.
  en: |
    French native, English fluent C1+, German basic A2.

competences:
  - title:
      fr: Backend et APIs
    description:
      fr: | # markdown
        - **TypeScript**, **Laravel** et **Python**
        - **Webhooks**, idempotence et retries
        - Création et utilisation d'**API REST**, **Inertia**, **Axios**
        - Implémentations techniques adaptées métier

  - title:
      fr: Intégrations de services
    description:
      fr: | # markdown
        - Transactions avec **Mollie**, **Stripe**
        - Emailing avec **Mailchimp**, campagnes **Mailcoach**
        - Assets avec **KeyCDN**
        - Outils de monitoring, performance et uptime

  - title:
      fr: Performance et fiabilité
    description:
      fr: | # markdown
        - Optimisation des performances par l'architecture et le code
        - Analytics avec **Plausible**, **Google Analytics**
        - Monitoring avec **Telescope**
        - Caching avec **Redis**

  - title:
      fr: Infrastructure et CI/CD
    description:
      fr: | # markdown
        - Gestion VPS, CI/CD **GitHub Actions** et **Ploi.io**
        - Management et backups **MariaDB**, **PostgreSQL**
        - **Code reviews** et **tests** avec **Vitest**, **Jest**, **Pest**, **Pytest**

  - title:
      fr: Sens produit et marketing
    description:
      fr: | # markdown
        - Diplômé design et communication
        - Compréhension des enjeux marketing et conversion
        - UI/UX avec **Figma**, **Vue.js**, **Tailwind**
        - Tests A/B et amélioration continue agile

experiences:
  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme d'**e-commerce** lausannoise commercialisant
        objets de design et polices de caractères. Stack optimisée **Laravel** et **TypeScript**, **Inertia**.
      en: | # markdown
        Growth within [weltkern.com](https://weltkern.com), a Swiss **e-commerce** platform selling design objects and typefaces.
        Monolithic stack based on **Laravel** and **TypeScript**.

    subsections:
      - from: 2024
        to: now
        title: Lead Developer
        description:
          fr: | # markdown
            - Refonte de la plateforme, réduction des temps de chargement moyens de **15s** à **200ms**
            - **Recrutement**, **encadrement**, **coordination** de **4 développeurs freelance**
            - Migration de **Stripe** vers **Mollie**, réduction mesurée des **frais de transaction de 20%**
            - Détection bottlenecks avec **Laravel Telescope** et **Plausible**
            - Planification des **sprints** et gestion des priorités
            - **Revues de code** et **tests** garantissant stabilité et cadence de release

          en: | # markdown
            - Complete platform redesign, technical and architectural leadership
            - **Recruitment**, **mentorship**, and **coordination** of a team of **4 freelance developers**
            - New architecture reduced average load time from **15s** to **200ms**
            - Migration to a new PSP achieving a measured **30% reduction in transaction fees**
            - Detection and elimination of bottlenecks using analytics tools
            - Definition of the **MVP** and priorities based on business goals
            - **Sprint** planning and **roadmap** management
            - **Code reviews** and **testing** ensuring stability and release cadence
            -
      - from: 2022
        to: now
        title: Fullstack Developer
        description:
          fr: | # markdown
            - Interfaces **TypeScript**, **Solid.js**, **Vue.js**
            - Backend **Laravel**, **MariaDB**, **PostgreSQL**
            - Mise en place de l'infrastructure, **VPS Infomaniak**
            - CI/CD avec **Ploi.io** et **GitHub Actions**
            - API **Inertia** et **RESTful**
            - Providers de paiement **Mollie**, **Stripe** et mails **Mailchimp** via API et webhooks
            - Performance avec **KeyCDN**, caching **Redis**
            - Design et **UI/UX** avec **TailwindCSS**, **Figma**, **Sketch**

  - company: Divers
    subsections:
      - from: 2022
        to: now
        title:
          fr: |
            Librairies
            open‑source
          en: |
            Open‑source
            Libraries

        description:
          fr: | # markdown
            - Développement et maintenance de projets **TypeScript open-source** accessibles sur [github.com/AUAUST](https://github.com/AUAUST)
            - [Primitive Kit](https://github.com/AUAUST/lib-js-primitive-kit#readme), utilitaires qui réduisent le boilerplate dans l'usage des primitifs
            - [Jaune](https://github.com/AUAUST/lib-js-jaune#readme), toolkit pour la manipulation des couleurs
            - [G-Class](https://github.com/AUAUST/lib-js-g-class#readme), alternative plus complète à [clsx](https://github.com/lukeed/clsx)
            - tous utilisés en production
          en: | # markdown
            Creation, evolution and maintenance of various **TypeScript open-source** projects, all available on [github.com/AUAUST](https://github.com/AUAUST).

            - [Primitive Kit](https://github.com/AUAUST/lib-js-primitive-kit#readme): **TypeScript** utility library simplifying the use of primitives
            - [Jaune](https://github.com/AUAUST/lib-js-jaune#readme): **Color** class for color manipulation in TypeScript and CSS
            - [G-Class](https://github.com/AUAUST/lib-js-g-class#readme): extended alternative to [clsx](https://github.com/lukeed/clsx)
            - all used in production

      - from: 2021
        to: now
        title:
          when_design_relevant:
            fr: |
              Développeur et
              designer freelance
            en: |
              Freelance
              developer
              and designer

          else: Freelance developer

        description:
          fr: | # markdown
            - Projets web freelance couvrant développement et design
            - développement **Vue.js**, **TypeScript**, **PHP** et **Laravel**
            - relation client et gestion de projet autonome
            - [lambert-forte.ch](https://lambert-forte.ch)
            - [auaust.ch](https://auaust.ch), one-pager Solid.js statique
            - [apademide.ch](https://apademide.ch)
            - projets de bachelor pour l'écal

          en: | # markdown
            Freelance web projects from planning and prototyping to deployment and long-term maintenance.

            - [lambert-forte.ch](https://lambert-forte.ch), Kirby CMS
            - [auaust.ch](https://auaust.ch), static one-pager built with Solid.js
            - [apademide.ch](https://apademide.ch), Kirby CMS
            - Bachelor projects for ÉCAL, Solid.js, vanilla TypeScript

  - company: Diplômes et certifications
    subsections:
      - from: 2026
        title: Python Associate
        description:
          fr: | # markdown
            Certifié **PCAP** par **Python Institute**, confirmant mes compétences en développement Python et mes bases théoriques en programmation générale.

      - from: 2025
        title: Scrum Master
        description:
          fr: | # markdown
            Certifié **PSM 1** par **Scrum.org** en gestion de projets Agile, confirmant ma capacité à travailler efficacement avec les équipes horizonales.
          en: | # markdown
            **Scrum Master** certification by **Scrum.org** for Agile project management, with a focus on team needs and skills.

      - from: 2018
        to: 2022
        title: | # markdown
          CFC de graphisme
        description:
          fr: | # markdown
            Diplômé de l'**ēracom** et récompensé par le prix de l’école
            et la distinction de la **SGD** (Swiss Graphic Designers) reconnaissant
            la qualité de mon travail et les meilleurs résultats tout au long de ma formation.

      - from: 2018
        to: 2022
        title: | # markdown
          Maturité professionnelle
        description:
          fr: | # markdown
            En parallèle de mon CFC, obtention d'une **maturité professionnelle** avec spécialisation
            en information, communication, arts appliqués et culture.

footnote:
  title:
    fr: J'utilise l'IA et j'automatise!
    en: I use AI and automate!

  text:
    fr: | # markdown
      Toujours en quête d'efficacité, ce CV a été mis en page par un outil custom et open‑source [github.com/AUAUST/tools-admin-auto-cv](https://github.com/AUAUST/tools-admin-auto-cv#readme).
      Son contenu, toutefois, n'a pas été généré par une IA.
    en: | # markdown
      Technology saves time. This resume was generated using a custom tool that allowed me to tailor it to your job offer.
      It is available as open-source on [github.com/AUAUST/tools-admin-auto-cv](https://github.com/AUAUST/tools-admin-auto-cv#readme).
