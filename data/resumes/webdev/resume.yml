title:
  when_target_python:
    fr: Développeur web fullstack spécialisé Python
    en: Python-focused fullstack web developer

  when_target_laravel:
    fr: Développeur web fullstack spécialisé Laravel
    en: Laravel-focused fullstack web developer

  when_design_relevant:
    fr: Développeur web fullstack alliant design et code
    en: Fullstack web developer bridging design and code

  else:
    fr: |
      Développeur fullstack
      certifié Agile
    en: Fullstack web developer Agile certified

subtitles:
  - when_design_relevant:
      fr: frontends orientés design
      en: Design-driven frontends and

  - when_target_python:
      fr: développement sur stack moderne
      en: development on modern stack

    when_target_laravel:
      fr: PHP moderne
      en: modern PHP

    else: PHP, Laravel

about:
  when_master_mode:
    fr: | # markdown
      Diplômé en design visuel, je conçois des applications où structure du code, clarté et pérennité
      guident l’architecture autant que l’expérience utilisateur.
      Intéressé par les environnements où exigence technique et créativité se rejoignent.
      Mainteneur de plusieurs projets open-source TypeScript utilisés en production.
    en: | # markdown
      Graduated in visual design, I build applications where code structure, clarity,
      and maintainability guide the architecture as much as user experience.
      Interested in environments where technical excellence and creativity meet.
      Maintainer of several TypeScript open-source projects used in production.

  when_target_laravel:
    fr: | # markdown
      Mes années d’expérience en développement full-stack Laravel
      me permettent de concevoir et de faire évoluer des plateformes web
      avec un focus sur la performance et la simplification des workflows complexes.

    en: | # markdown
      Experienced full-stack developer with a background in visual design,
      I’m looking to join a Laravel-focused team to contribute to the creation
      of technically robust and creatively driven products.

  when_design_relevant:
    fr: | # markdown
      Développeur web et designer graphique, je cherche aujourd'hui à rejoindre
      une équipe créative où je serai en mesure de mettre à profit mes compétences techniques et
      mon sens esthétique.
    en: | # markdown
      Web developer and graphic designer graduate, I’m looking to join a creative team
      where I can leverage both my technical skills and aesthetic sense.
  else:
    fr: | # markdown
      Développeur full-stack expérimenté, certifié en management Agile, titulaire d'un CFC en design visuel,
      je cherche à rejoindre une équipe de développeurs web où je pourrai contribuer
      à la création de produits à forte valeur technique.
    en: | # markdown
      Experienced full-stack developer with a background in visual design, Agile certified,
      I’m looking to join a web development team where I can contribute
      to the creation of technically robust products.

languages:
  fr: |
    Français langue maternelle, anglais avancé C1+, allemand élémentaire A2.
  en: |
    French native, English fluent C1+, German basic A2.

competences:
  - title:
      fr: Développement backend
      en: Backend Development
    description:
      fr: | # markdown
        - **Laravel 10-12** et **Python**
        - Supervision avec **Laravel Telescope**, **Google Analytics**, **Plausible**
        - Gestion et usage de **MariaDB**, **PostgreSQL** et **Redis**
        - Tests **Pest**
        - **CI/CD** avec **GitHub Actions**, **Ploi.io**
      en: | # markdown
        - **Laravel 10-12** and **Kirby CMS**
        - Monitoring and analytics using **Laravel Telescope**, **Google Analytics**, **Plausible**
        - Database management with **MariaDB**, **PostgreSQL** and **Redis**
        - Unit and integration testing with **Pest**
        - **CI/CD** pipelines using **GitHub Actions**, **Ploi.io**

  - title:
      fr: Développement frontend
      en: Frontend development
    description:
      fr: | # markdown
        - Interfaces **Solid.js**, **Vue** et **React**
        - Styling **Tailwind CSS** et **modules SCSS**
        - Consommation d’APIs **Inertia.js**, **API RESTful** avec **Axios**
        - Conception **UX/UI**
      en: | # markdown
        - Development of reactive interfaces using **Solid.js**, **Vue**, and **React**
        - Styling with **Tailwind CSS** and **SCSS modules**
        - API consumption via **Inertia.js** and **RESTful API** calls with **Axios**
        - **UX/UI** design

  - title:
      fr: Gestion d'équipe
      en: Team management
    description:
      fr: | # markdown
        - Leadership technique et gestion de petites équipes
        - **Recrutement** basé sur les **besoins** et **compétences**
        - Analyse des forces individuelles
      en: | # markdown
        - Technical leadership and small-team management
        - **Recruitment** based on **skills** and **project needs**
        - Analysis of individual strengths

  - title:
      fr: Gestion de projet
      en: Agile methodology
    description:
      fr: | # markdown
        - Approche **Agile** intérative et incrémentale
        - Réduction du **time-to-market**
        - Planification des sprints et organisation de la roadmap
        - Adaptation et réévaluation continue des objectifs selon feedbacks internes et utilisateurs
      en: | # markdown
        - Certified **Scrum Master** by **Scrum.org** with 2 years of practical experience
        - Reduction of **time-to-market**
        - Sprint planning and roadmap organization
        - Continuous adaptation and reassessment of goals based on internal and user feedback

experiences:
  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme d'**e-commerce** suisse commercialisant
        objets de design et polices de caractères. Stack monolithique **Laravel** et **Solid.js**.
      en: | # markdown
        Growth within [weltkern.com](https://weltkern.com), a Swiss **e-commerce** platform selling design objects and typefaces.
        Monolithic stack based on **Laravel** and **Solid.js**.

    subsections:
      - from: 2024
        title:
          Lead Developer
          # when_design_relevant: "Lead developer\n& designer"
          # else: Lead Developer
        description:
          fr: | # markdown
            - Refonte complète de la plateforme, pilotage technique et architectural
            - **Recrutement**, **encadrement**, **coordination** de **4 développeurs freelance**
            - Nouvelle architecture réduit le temps de chargement moyen de **15s** à **200ms**
            - Migration de **Stripe** vers **Mollie**, réduction mesurée des **frais de transaction de 30%**
            - Élimination des goulets d’étranglement avec **Laravel Telescope** et **Plausible**
            - Définition du **MVP** et des priorités selon les objectifs business
            - Planification des **sprints** et gestion du **backlog**
            - **Revues de code** et **tests** garantissant stabilité et cadence de release
          en: | # markdown
            - Complete platform redesign, technical and architectural leadership
            - **Recruitment**, **mentorship**, and **coordination** of a team of **4 freelance developers**
            - New architecture reduced average load time from **15s** to **200ms**
            - Migration to a new PSP achieving a measured **30% reduction in transaction fees**
            - Detection and elimination of bottlenecks using analytics tools
            - Definition of the **MVP** and priorities based on business goals
            - **Sprint** planning and **roadmap** management
            - **Code reviews** and **testing** ensuring stability and release cadence

      - from: 2023
        title:
          Fullstack Developer
          # when_design_relevant: "Fullstack developer\n& designer"
        description:
          fr: | # markdown
            - Développement **Laravel 10-12**
            - Mise en place des bases de données **MariaDB** et **Redis**
            - API **Inertia.js**
            - Webhooks **Mollie** pour process des paiements
            - Gestion serveur avec **Ploi.io** sur **VPS Infomaniak**
            - Déploiements continus avec **Ploi.io** et **GitHub Actions** permettant les hotfixes en production sans downtime en moins de 15 minutes
            - Système de backup **rClone** avec **SwissBackup**
          en: | # markdown
            - Development with **Laravel 10-12**
            - Database setup with **MariaDB** and **Redis**
            - **Inertia.js** API integration
            - **Mollie** webhooks for payment processing
            - Server management using **Ploi.io** on **Infomaniak VPS**
            - Continuous deployment via **Ploi.io** and **GitHub Actions**, enabling production hotfixes in under 15 minutes
            - Backup system with **rClone** and **SwissBackup**

      - from: 2022
        title:
          Frontend Developer
          # when_design_relevant: "Frontend developer\n& designer"
          # else: Frontend Developer
        description:
          fr: | # markdown
            - Intégration frontend **Solid.js** (storefront) et **Vue** (admin)
            - Mise en place **Kirby CMS** pour contenu produits et éditorial
            - Design **UI**/**UX** responsif **Figma**
            - Optimisation des performances avec **KeyCDN**
            - Design de composants **SCSS modules** et **Tailwind CSS**
            - Maintient du site **WordPress** & **React** existant avant migration
          en: | # markdown
            - Frontend integration with **Solid.js** (storefront) and **Vue** (admin)
            - Implementation of **Kirby CMS** for product and editorial content
            - Responsive **UI/UX** design with **Figma**
            - Performance optimization using **KeyCDN**
            - Component styling with **SCSS modules** and **Tailwind CSS**
            - Maintenance of the existing **WordPress** & **React** frontend prior to migration

