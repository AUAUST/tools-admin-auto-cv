about:
  when_target_laravel:
    fr: | # markdown
      Développeur full-stack expérimenté, titulaire d'un CFC en design visuel,
      je souhaite aujourd’hui intégrer une équipe Laravel pour participer
      à la conception de produits à forte valeur technique et créative.
    en: | # markdown
      Experienced full-stack developer with a background in visual design,
      I’m looking to join a Laravel-focused team to contribute to the creation
      of technically robust and creatively driven products.
  when_design_relevant:
    fr: | # markdown
      Développeur web et designer graphique, je cherche aujourd'hui à rejoindre
      une équipe créative où je serai en mesure de mettre à profit mes compétences techniques et
      mon sens esthétique.
    en: | # markdown
      Web developer and graphic designer diplômé, I’m looking to join a creative team
      where I can leverage both my technical skills and aesthetic sense.
  else:
    fr: | # markdown
      Développeur full-stack expérimenté, titulaire d'un CFC en design visuel,
      je cherche à rejoindre une équipe de développeurs web où je pourrai contribuer
      à la création de produits à forte valeur technique.
    en: | # markdown
      Experienced full-stack developer with a background in visual design,
      I’m looking to join a web development team where I can contribute
      to the creation of technically robust products.

languages:
  fr: |
    Français langue maternelle, anglais avancé (C1+), allemand élémentaire.
  en: |
    French native, English fluent (C1+), German basic.

competences:
  - title:
      fr: Développement backend
      en: Backend Development
    description:
      fr: | # markdown
        - **Laravel 10-12** et **Kirby CMS**
        - Supervision avec **Laravel Telescope**, **Google Analytics**, **Plausible**
        - Gestion et usage de **MariaDB**, **PostgreSQL** et **Redis**
        - Tests **Pest**
        - **CI/CD** avec **GitHub Actions**, **Ploi.io**
      en: | # markdown
        - **Laravel 10-12** and **Kirby CMS**
        - Monitoring and analytics using **Laravel Telescope**, **Google Analytics**, **Plausible**
        - Database management with **MariaDB**, **PostgreSQL** and **Redis**
        - Unit and integration testing with **Pest**
        - **CI/CD** pipelines using **GitHub Actions**, **Ploi.io**

  - title:
      fr: Développement frontend
      en: Frontend development
    description:
      fr: | # markdown
        - Interfaces **Solid.js**, **Vue** et **React**
        - Styling **Tailwind CSS** et **modules SCSS**
        - Consommation d’APIs **Inertia.js**, **API RESTful** avec **Axios**
        - Conception **UX/UI**
      en: | # markdown
        - Development of reactive interfaces using **Solid.js**, **Vue**, and **React**
        - Styling with **Tailwind CSS** and **SCSS modules**
        - API consumption via **Inertia.js** and **RESTful API** calls with **Axios**
        - **UX/UI** design

  - title:
      fr: Gestion d'équipe
      en: Team management
    description:
      fr: | # markdown
        - Leadership technique et gestion de petites équipes
        - **Recrutement** basé sur les **besoins** et **compétences**
        - Analyse des forces individuelles
      en: | # markdown
        - Technical leadership and small-team management
        - **Recruitment** based on **skills** and **project needs**
        - Analysis of individual strengths

  - title:
      fr: Gestion de projet
      en: Project management
    description:
      fr: | # markdown
        - Approche **Agile** intérative et incrémentale
        - Réduction du **time-to-market**
        - Planification des sprints et organisation de la roadmap
        - Adaptation et réévaluation continue des objectifs selon feedbacks internes et utilisateurs
      en: | # markdown
        - **Agile** iterative and incremental approach
        - Reduction of **time-to-market**
        - Sprint planning and roadmap organization
        - Continuous adaptation and reassessment of goals based on internal and user feedback

experiences:
  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme d'**e-commerce** suisse commercialisant
        objets de design et polices de caractères. Stack monolithique **Laravel** et **Solid.js**.
      en: | # markdown
        Growth within [weltkern.com](https://weltkern.com), a Swiss **e-commerce** platform selling design objects and typefaces.
        Monolithic stack based on **Laravel** and **Solid.js**.

    subsections:
      - from: 2024
        title:
          when_design_relevant: "Lead developer\n& designer"
          else: Lead Developer
        description:
          fr: | # markdown
            - Pilotage technique et architectural
            - **Recrutement**, **encadrement** de **4 développeurs freelance**
            - Correction des points de friction avec **Laravel Telescope**, **Plausible**
            - Définition du **MVP** pour la refonte de la plateforme
            - Planification des sprints et roadmap
          en: | # markdown
            - Technical and architectural leadership
            - **Recruitment** and **management** of **4 freelance developers**
            - Correction of bottlenecks using **Laravel Telescope**, **Plausible**
            - Definition of the **MVP** for the platform redesign
            - Sprint planning and roadmap organization

      - from: 2023
        title:
          when_design_relevant: "Fullstack developer\n& designer"
          else: Fullstack Developer
        description:
          fr: | # markdown
            - Développement backend **Laravel 10-11**
            - Mise en place des bases de données **MariaDB** et **Redis**
            - API **Inertia.js**
            - Webhooks **Mollie** pour process des paiements
            - Gestion serveur avec **Ploi.io** sur **VPS Infomaniak**
            - Déploiements continus avec **Ploi.io** et **GitHub Actions** permettant les hotfixes en production sans downtime en moins de 15 minutes
            - Système de backup **rClone** avec **SwissBackup**
          en: | # markdown
            - Backend development with **Laravel 10-11**
            - Database setup with **MariaDB** and **Redis**
            - **Inertia.js** API integration
            - **Mollie** webhooks for payment processing
            - Server management using **Ploi.io** on **Infomaniak VPS**
            - Continuous deployment via **Ploi.io** and **GitHub Actions**, enabling production hotfixes in under 15 minutes
            - Backup system with **rClone** and **SwissBackup**

      - from: 2022
        title:
          when_design_relevant: "Frontend developer\n& designer"
          else: Frontend Developer
        description:
          fr: | # markdown
            - Intégration frontend **Solid.js** (storefront) et **Vue** (admin)
            - Mise en place **Kirby CMS** pour contenu produits et éditorial
            - Design **UI**/**UX** responsif **Figma**
            - Optimisation des performances avec **KeyCDN**
            - Design de composants **SCSS modules** et **Tailwind CSS**
            - Maintient du site **WordPress** & **React** existant avant migration
          en: | # markdown
            - Frontend integration with **Solid.js** (storefront) and **Vue** (admin)
            - Implementation of **Kirby CMS** for product and editorial content
            - Responsive **UI/UX** design with **Figma**
            - Performance optimization using **KeyCDN**
            - Component styling with **SCSS modules** and **Tailwind CSS**
            - Maintenance of the existing **WordPress** & **React** frontend prior to migration

  - company: AUAUST
    description:
      fr: | # markdown
        Activités freelance en développement web fullstack et design graphique pour des
        outils open‑source, des clients (PME, universitaires) et des projets personnels.
      en: | # markdown
        Freelance activity in full-stack web development and graphic design,
        focused on open-source tools, client work (SMEs, academics), and personal projects.

    subsections:
      - from: 2022
        title:
          fr: "Mainteneur\nopen‑source"
          en: "Open-Source\nProjects Maintainer"
        description:
          fr: | # markdown
            Depuis 2022, création, évolution et maintenance d'une variété de projets **TypeScript** **open-source** tous accessibles sur [github.com/AUAUST](https://github.com/AUAUST).

            - [Primitive Kit](https://github.com/AUAUST/lib-js-primitive-kit#readme), bibliothèque d'utilitaires **TypeScript qui** facilite l'usage des primitifs
            - [Jaune](https://github.com/AUAUST/lib-js-jaune#readme), classe **Color** aide à la manipulation des couleurs pour TypeScript et CSS
            - [G-Class](https://github.com/AUAUST/lib-js-g-class#readme), alternative plus complète à [clsx](https://github.com/lukeed/clsx)
            - tous utilisés en production
          en: | # markdown
            Since 2022, creation, evolution and maintenance of various **TypeScript open-source** projects, all available on [github.com/AUAUST](https://github.com/AUAUST).

            - [Primitive Kit](https://github.com/AUAUST/lib-js-primitive-kit#readme): **TypeScript** utility library simplifying the use of primitives
            - [Jaune](https://github.com/AUAUST/lib-js-jaune#readme): **Color** class for color manipulation in TypeScript and CSS
            - [G-Class](https://github.com/AUAUST/lib-js-g-class#readme): extended alternative to [clsx](https://github.com/lukeed/clsx)
            - all used in production

      - from: 2021
        title:
          when_design_relevant: "Freelance developer\n& designer"
          else: Freelance Developer
        description:
          fr: | # markdown
            Depuis 2021, projets web freelance de la planification et du maquettage à la mise en ligne et maintenance à long terme.

            - [lambert-forte.ch](https://lambert-forte.ch), Kirby CMS
            - [auaust.ch](https://auaust.ch), one-pager Solid.js statique
            - [apademide.ch](https://apademide.ch), Kirby CMS
            - projets de bachelor pour l'écal, Solid.js, vanilla TypeScript

          en: | # markdown
            Since 2021, freelance web projects from planning and prototyping to deployment and long-term maintenance.

            - [lambert-forte.ch](https://lambert-forte.ch), Kirby CMS
            - [auaust.ch](https://auaust.ch), static one-pager built with Solid.js
            - [apademide.ch](https://apademide.ch), Kirby CMS
            - Bachelor projects for ÉCAL, Solid.js, vanilla TypeScript

  - company: ēracom
    description:
      fr: | # markdown
        **CFC de graphisme** avec prix de l’école et de la SGD (Swiss Graphic Designers) reconnaissant les meilleurs résultats et moyennes de ma promotion.
      en: | # markdown
        Graduated with a **CFC in Graphic Design**, awarded the school prize and the SGD (Swiss Graphic Designers) distinction for best results and top average in the program.

