about:
  fr: | # markdown
    Avec 5 *ans* d'expérience en développement web fullstack, je développe des sites web avec une approche
    centrée sur l'expérience utilisateur, biais issu de mon diplôme en design et communication visuelle.
    Mes outils de prédilection sont Laravel, Kirby CMS en backend; Vue.js, Solid.js et Tailwind CSS en frontend.
  en: | # markdown
    With 5 years of experience in fullstack web development, I build websites with a user-centric approach,
    a bias stemming from my degree in design and visual communication.
    My tools of choice are Laravel, Kirby CMS in the backend; Vue.js, Solid.js and Tailwind CSS in the frontend.

competences:
  backend_php: ""

experiences:
  - company: WELTKERN®
    description:
      fr: | # markdown
        J'ai leadé le développement de l'actuelle plateforme d'e-commerce de [weltkern.com](https://weltkern.com),
        startup spécialisée dans la vente d'objets de design et de polices de caractères.

    subsections:
      - from: 2024
        title:
          when_design_relevant: Lead Developer & Designer
          else: Lead Developer
        description:
          fr: | # markdown
            Évolution au sein d'une startup d'e-commerce d'objets de design et de polices de caractères basée en Suisse.

      - from: 2023
        title:
          when_design_relevant: Fullstack Developer & Designer
          else: Fullstack Developer
        description:
          fr: | # markdown
            Développement et maintenance d'une plateforme e-commerce sur mesure, intégrant des fonctionnalités avancées
            pour la gestion des produits, des commandes et des clients.

      - from: 2022
        title:
          when_design_relevant: Frontend Developer & Designer
          else: Frontend Developer
        description:
          fr: | # markdown
            Développement de l'interface utilisateur pour une plateforme d'e-commerce, en mettant l'accent sur l'expérience utilisateur et l'accessibilité.

  - company: AUAUST
    description:
      fr: | # markdown
        Activités freelance en développement web fullstack et design graphique.

    subsections:
      - from: 2022
        title:
          fr: Mainteneur Open-Source
          en: Maintainer of Open-Source Projects
        description:
          fr: | # markdown
            Dès 2022 jusqu'à aujourd'hui, création, évolution et maintenance d'une variété de projets TypeScript open-source tous accessibles sur [github.com/AUAUST](https://github.com/AUAUST).

            [Primitive Kit](https://github.com/AUAUST/lib-js-primitive-kit), bibliothèque d'utilitaires TypeScript qui facilite l'usage des types primitifs ;
            [Jaune](https://github.com/AUAUST/lib-js-jaune), classe `Color` minimale qui facilite la manipulation des couleurs en TypeScript et CSS ;
            [G-Class](https://github.com/AUAUST/lib-js-g-class), alternative plus complète à [clsx](https://github.com/lukeed/clsx).

      - from: 2021
        title:
          when_design_relevant: Freelance Developer & Designer
          else: Freelance Developer
        description:
          fr: | # markdown
            Dès 2021, divers projets freelance de la planification à la mise en ligne et maintenance à long terme.
            Notamment, [lambert-forte.ch](https://lambert-forte.ch) (Kirby CMS), [auaust.ch](https://auaust.ch) (one-pager statique Solid.js),
            [apademide.ch](https://apademide.ch) (Kirby CMS), ainsi que des projets de bachelors pour des étudiants de l'ECAL (Solid.js, vanilla TypeScript).

    # subsections:
