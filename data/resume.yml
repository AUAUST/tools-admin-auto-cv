about:
  fr: | # markdown
    Avec mes années d'expérience en développement web fullstack, je développe des sites web avec une approche
    centrée sur l'expérience utilisateur, biais issu de mon diplôme en design et communication visuelle.
  en: | # markdown
    With my years of experience in fullstack web development, I build websites with a user-centric approach,
    a bias stemming from my degree in design and visual communication.

languages:
  fr: |
    Français langue maternelle, anglais courant et professionnel avancé, allemand élémentaire.
  en: |
    French native, English fluent professional, German basic.

competences:
  - title:
      fr: Développement Backend
    description:
      fr: | # markdown
        - Développement backend PHP avec **Laravel 10-12** et **Kirby CMS**
        - Supervision avec les outils **Laravel Telescope**, **Google Analytics**, **Plausible**
        - Gestion et usage des DB **MariaDB**, **PostgresSQL** et **Redis**
        - Tests unitaires et d'intégration **Pest**
        - **CI/CD** avec **GitHub Actions**

  - title: Développement Frontend
    description:
      fr: | # markdown
        - Développement d’interfaces avec **Solid.js**, **Vue** et **React**
        - Styling avec **Tailwind CSS** et **modules SCSS**
        - Consommation d’APIs via **Inertia.js** et **API RESTful**, **Axios**
        - Participation à la conception **UX/UI** grâce aux compétences en design

  - title: Gestion d'équipe
    description:
      fr: | # markdown
        - Leadership technique et gestion de petites équipes
        - **Recrutement** basé sur les **besoins** et **compétences**
        - Délégation des tâches et coordination entre les membres de l'équipe selon les forces individuelles

  - title: Gestion de projet
    description:
      fr: | # markdown
        - Approche **Agile** axée sur la réduction du **time-to-market** des **MVP**
        - Planification des sprints et l’organisation de la roadmap
        - Adaptation et réévaluation continue des objectifs basés sur les feedbacks internes et utilisateurs

experiences:
  - company: WELTKERN®
    description:
      fr: | # markdown
        Évolution au sein de [weltkern.com](https://weltkern.com), plateforme d'**e-commerce** suisse commercialisant
        objets de design et polices de caractères. Stack monolithique **Laravel** et **Solid.js**.

    subsections:
      - from: 2024
        title:
          when_design_relevant: "Lead Developer\n& Designer"
          else: Lead Developer
        description:
          fr: | # markdown
            - Prise des décisions techniques et architecturales
            - **recrutement**, **gestion** d'une équipe de **4 développeurs freelance**
            - analyse des données des outils monitoring **Laravel Telescope** et **Plausible** pour la détection et la correction des points de friction
            - définition du **MVP** pour la refonte de la plateforme
            - organisation du roadmap et **planning des sprints**

      - from: 2023
        title:
          when_design_relevant: "Fullstack Developer\n& Designer"
          else: Fullstack Developer
        description:
          fr: | # markdown
            - Développement backend **Laravel 10-11**
            - mise en place des bases de données **MariaDB** et **Redis**
            - API **Inertia.js**
            - webhooks **Mollie** pour process des paiements
            - gestion serveur avec **Ploi.io** sur **VPS Infomaniak**
            - déploiements continus avec **Ploi.io** et **GitHub Actions** permettant les hotfixes en production sans downtime en moins de 15 minutes
            - système de backup **rClone** avec **SwissBackup**

      - from: 2022
        title:
          when_design_relevant: "Frontend Developer\n& Designer"
          else: Frontend Developer
        description:
          fr: | # markdown
            - Intégration frontend **Solid.js** (storefront) et **Vue** (admin)
            - mise en place **Kirby CMS** pour contenu produits et éditorial
            - design **UI**/**UX** responsif **Figma**
            - optimisation des performances avec **KeyCDN**
            - design de composants **SCSS modules** et **Tailwind CSS**
            - maintient du frontend **React** existant avant migration

  - company: AUAUST
    description:
      fr: | # markdown
        Activités freelance en développement web fullstack et design graphique pour des
        outils open‑source, des clients et des projets personnels.

    subsections:
      - from: 2022
        title:
          fr: Mainteneur Open‑Source
          en: "Open-Source\nProjects Maintainer"
        description:
          fr: | # markdown
            Dès 2022 jusqu'à aujourd'hui, création, évolution et maintenance d'une variété de projets **TypeScript** **open-source** tous accessibles sur [github.com/AUAUST](https://github.com/AUAUST).

            - [Primitive Kit](https://github.com/AUAUST/lib-js-primitive-kit#readme), bibliothèque d'utilitaires **TypeScript qui** facilite l'usage des primitifs
            - [Jaune](https://github.com/AUAUST/lib-js-jaune#readme), classe **Color** aide à la manipulation des couleurs pour TypeScript et CSS
            - [G-Class](https://github.com/AUAUST/lib-js-g-class#readme), alternative plus complète à [clsx](https://github.com/lukeed/clsx)
            - tous utilisés en production

      - from: 2021
        title:
          when_design_relevant: "Freelance Developer\n& Designer"
          else: Freelance Developer
        description:
          fr: | # markdown
            Dès 2021, divers projets web freelance de la planification et du maquettage à la mise en ligne et maintenance à long terme.

            - [lambert-forte.ch](https://lambert-forte.ch), Kirby CMS
            - [auaust.ch](https://auaust.ch), one-pager Solid.js statique
            - [apademide.ch](https://apademide.ch), Kirby CMS
            - projets de bachelor pour l'écal, Solid.js, vanilla TypeScript

ai_and_automation:
  fr: J'utilise l'IA et j'automatise!
  en: I use AI and automate!

notice:
  fr: | # markdown
    La technologie fait gagner du temps. J'ai généré ce CV à l'aide d'un outil custom qui m'a permis de l'adapter à votre offre d'emploi,
    mettant en avant les compétences et expériences les plus pertinentes.
    Il est accessible en open-source sur [github.com/AUAUST/tools-admin-auto-cv](https://github.com/AUAUST/tools-admin-auto-cv#readme).
    C'est le genre d'optimisation que j'apporte à mon travail quotidien, garantissant tant efficacité que qualité.
  en: | # markdown
    Technology saves time. I generated this resume using a custom tool that allowed me to quickly adapt it to your job offer,
    highlighting the most relevant skills and experiences.
    It is accessible open-source at [github.com/AUAUST/tools-admin-auto-cv](https://github.com/AUAUST/tools-admin-auto-cv#readme).
    This is the kind of optimization I bring to my daily work, ensuring both efficiency and quality.
